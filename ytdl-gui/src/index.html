<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>YT-DLP GUI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css" />
    <script defer src="render.js"></script>
</head>

<body>
    <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle" title="Toggle dark/light mode">
            <span class="theme-icon">🌙</span>
        </button>
    </div>

    <h1>YTDL GUI</h1>
    <form>
        <div>
            <input placeholder="Introduce la URL del video..." class="input" type="url" name="urlDownload"
                id="urlDownload">
        </div>

        <!-- Video Download Container -->
        <div class="download-container">
            <div class="download-option">
                <button class="btn btn-dark" id="videoDownloadButton" type="button">Descargar Video</button>
                <div class="dropdown-menu-custom">
                    <select id="videoQuality" class="quality-select">
                        <option value="1080">1080p</option>
                        <option value="720">720p</option>
                        <option value="480">480p</option>
                        <option value="360">360p</option>
                    </select>
                </div>
                <div class="dropdown-menu-custom">
                    <select id="videoFormat" class="quality-select">
                        <option value="mp4">MP4</option>
                        <option value="webm">WEBM</option>
                        <option value="mkv">MKV</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Audio Download Container -->
        <div class="download-container">
            <div class="download-option">
                <button class="btn btn-dark" id="audioDownloadButton" type="button">Descargar Audio</button>
                <div class="dropdown-menu-custom">
                    <select id="audioFormat" class="quality-select">
                        <option value="mp3">MP3 (128 kbps)</option>
                        <option value="m4a">M4A (192 kbps)</option>
                        <option value="wav">WAV</option>
                        <option value="opus">OPUS (128 kbps)</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="download-container">
            <div class="download-option">
                <button class="btn btn-dark mr-1" type="button" style="min-width: 250px;" id="selectFolderButton">
                    Seleccionar Carpeta
                </button>
                <input disabled type="text" class="form-control" id="downloadFolder"
                    placeholder="Selecciona la carpeta de descarga" readonly>
            </div>
        </div>
    </form>

    <!-- Div para los mensages de error, success etc -->
    <div>
        <h3 class="text-success" id="downloadSuccessMessage" hidden>Descargado correctamente!</h3>
        <h3 class="text-danger" id="downloadErrorMessage" hidden>Ha ocurrido un error en la descarga</h3>
        <p class="text-danger" id="downloadErrorText" hidden></p>
        <h3 class="text-info" id="downloadingMessage" hidden>Descargando video...</h3>
    </div>

    <!-- Div para el log que va saliendo en la consola -->
    <div id="divLogs" class="logDiv" hidden>
    </div>

</body>

</html>
